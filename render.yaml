services:
  - type: web
    name: muziki-backend
    runtime: node
    rootDir: apps/backend-nest
    plan: free
    buildCommand: npm install && npm run prisma:generate && npx prisma db push && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: muziki-db
          property: connectionString
      - key: MUZIKI_STORAGE_ROOT
        value: /tmp/muziki-storage
      - key: JWT_SECRET
        generateValue: true
      - key: MUZIKI_MINIMUM_WITHDRAWAL_CDF
        value: "20000"
      - key: MUZIKI_ALLOWED_ORIGINS
        value: "https://muziki.onrender.com,https://muziki-listener-portal.onrender.com,https://muziki-artist-portal.onrender.com,https://muziki-admin-portal.onrender.com"
      - key: MUZIKI_LISTENER_URL
        value: "https://muziki.onrender.com"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: kalombobillgate@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: MUZIKI_ADMIN_EMAIL
        value: "kalombobillgate@gmail.com"
      - key: MUZIKI_ADMIN_PASSWORD
        sync: false
      - key: DRC_VODACOM_MERCHANT_PHONE
        value: "+243 834 574 609"
      - key: DRC_AIRTEL_MERCHANT_PHONE
        value: "+243 992 313 395"
      - key: DRC_ORANGE_MERCHANT_PHONE
        sync: false
      - key: DRC_AFRICELL_MERCHANT_PHONE
        sync: false

  - type: web
    name: muziki-listener-portal
    runtime: static
    staticPublishPath: apps/listener-portal

  - type: web
    name: muziki-artist-portal
    runtime: static
    staticPublishPath: apps/artist-portal

  - type: web
    name: muziki-admin-portal
    runtime: static
    staticPublishPath: apps/admin-portal

databases:
  - name: muziki-db
    plan: free
    databaseName: muziki
    user: muziki
