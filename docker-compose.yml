services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muziki
      POSTGRES_USER: muziki
      POSTGRES_PASSWORD: muziki
    ports:
      - "5432:5432"
    volumes:
      - muziki_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  muziki_postgres:

